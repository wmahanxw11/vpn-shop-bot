<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ورود به پنل مدیریت</title>
    <style>
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
        .login-container{background:white;padding:40px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.3);width:100%;max-width:400px}
        h1{text-align:center;color:#333;margin-bottom:30px}
        .form-group{margin-bottom:20px}
        label{display:block;margin-bottom:5px;color:#555}
        input[type="password"]{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px;font-size:16px}
        button{width:100%;padding:12px;background:#667eea;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer}
        button:hover{background:#764ba2}
        .error{color:#e74c3c;text-align:center;margin-bottom:15px}
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 پنل مدیریت</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">ورود</button>
        </form>
    </div>
</body>
</html>
